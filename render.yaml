services:
  # Main backend web service (Docker-based)
  - type: web
    name: elocate-backend
    env: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /actuator/health
    envVars:
      - key: DB_URL
        value: jdbc:postgresql://aws-1-ap-southeast-1.pooler.supabase.com:6543/postgres?sslmode=require&prepareThreshold=0
      - key: DB_USERNAME
        value: postgres.qnnkizacregmdsfgqrsw
      - key: DB_PASSWORD
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRATION_MS
        value: 86400000
      - key: OTP_EXPIRY_MINUTES
        value: 10
      - key: OTP_MAX_ATTEMPTS
        value: 3
      - key: AUTH0_DOMAIN
        value: elocate-dev.us.auth0.com
      - key: AUTH0_CLIENT_ID
        sync: false
      - key: AUTH0_CLIENT_SECRET
        sync: false
      - key: AUTH0_CONNECTION
        value: Username-Password-Authentication
      - key: SERVER_PORT
        value: 8080
      - key: CONTEXT_PATH
        value: /elocate
      - key: SPRING_PROFILES_ACTIVE
        value: production
      - key: JAVA_TOOL_OPTIONS
        value: -Xmx512m -Xms256m -XX:+UseContainerSupport
      - key: EMAIL_HOST
        value: smtp-relay.brevo.com
      - key: EMAIL_PORT
        value: 587
      - key: EMAIL_USERNAME
        sync: false
      - key: EMAIL_PASSWORD
        sync: false
      - key: EMAIL_FROM
        value: sumaleshka@gmail.com
      - key: EMAIL_PROVIDER
        value: smtp
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_S3_BUCKET_NAME
        value: elocate-pickup-photos
      - key: AWS_S3_DOCUMENTS_BUCKET_NAME
        value: elocate-partner-documents
      - key: AWS_S3_REGION
        value: eu-north-1
      - key: DRIVER_SLA_HOURS
        value: 24
      - key: DRIVER_SLA_MONITORING_ENABLED
        value: true
      - key: FRONTEND_URL
        value: https://elocate-frontend.vercel.app
      - key: APP_BASE_URL
        value: https://elocate-frontend.vercel.app

  # Cron job: ping the backend every 5 minutes to prevent Render free-tier spin-down
  - type: cron
    name: elocate-keep-alive
    env: docker
    dockerfilePath: ./Dockerfile.keepalive
    schedule: "*/5 * * * *"
    envVars:
      - key: BACKEND_URL
        value: https://elocate-backend.onrender.com/elocate
