# Development Configuration
# Activate with: mvn spring-boot:run -Dspring-boot.run.profiles=dev
# Or set environment variable: SPRING_PROFILES_ACTIVE=dev

spring:
  devtools:
    restart:
      enabled: true
      additional-paths: src/main/java
      exclude: static/**,public/**
    livereload:
      enabled: true
      
  # Development database settings (if different from main)
  # Uncomment and modify if needed
  # datasource:
  #   url: jdbc:postgresql://localhost:5432/elocate_dev
  
  # Show SQL queries in console (helpful for debugging)
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        
# Logging configuration for development
logging:
  level:
    com.elocate: DEBUG
    org.springframework.web: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
