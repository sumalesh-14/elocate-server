    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  otp:
    expiry-minutes: ${OTP_EXPIRY_MINUTES:10}
    max-attempts: ${OTP_MAX_ATTEMPTS:3}
  frontend:
    url: ${FRONTEND_URL:http://localhost:3000}
  driver:
    sla-hours: ${DRIVER_SLA_HOURS:24}
