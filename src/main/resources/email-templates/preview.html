<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ELocate Email Templates Preview</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Arial, sans-serif; background: #f0f7f0; color: #2d2d2d; min-height: 100vh; }

        /* Top bar */
        .topbar { background: linear-gradient(135deg, #1a7a3c 0%, #2ecc71 100%); padding: 20px 32px; display: flex; align-items: center; gap: 16px; box-shadow: 0 2px 12px rgba(26,122,60,0.2); }
        .topbar .brand { color: #fff; font-size: 20px; font-weight: 800; letter-spacing: 0.5px; }
        .topbar .brand span { font-weight: 400; opacity: 0.8; font-size: 14px; margin-left: 8px; }

        /* Layout */
        .layout { display: flex; height: calc(100vh - 64px); }

        /* Sidebar */
        .sidebar { width: 280px; flex-shrink: 0; background: #ffffff; border-right: 1px solid #d1e7d8; overflow-y: auto; padding: 20px 0; }
        .sidebar-title { font-size: 11px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; color: #6b7280; padding: 0 20px 12px; }
        .template-btn { display: flex; align-items: center; gap: 12px; width: 100%; padding: 12px 20px; border: none; background: none; cursor: pointer; text-align: left; transition: background 0.15s; border-left: 3px solid transparent; }
        .template-btn:hover { background: #f4fbf6; }
        .template-btn.active { background: #f4fbf6; border-left-color: #1a7a3c; }
        .template-btn .btn-icon { font-size: 20px; flex-shrink: 0; }
        .template-btn .btn-text { flex: 1; }
        .template-btn .btn-name { font-size: 13px; font-weight: 600; color: #1a1a1a; display: block; }
        .template-btn .btn-desc { font-size: 11px; color: #6b7280; display: block; margin-top: 2px; }
        .template-btn.active .btn-name { color: #1a7a3c; }

        /* Preview area */
        .preview-area { flex: 1; overflow: hidden; display: flex; flex-direction: column; }
        .preview-toolbar { background: #fff; border-bottom: 1px solid #d1e7d8; padding: 12px 24px; display: flex; align-items: center; justify-content: space-between; }
        .preview-toolbar .current-name { font-size: 14px; font-weight: 700; color: #1a7a3c; }
        .preview-toolbar .current-file { font-size: 12px; color: #6b7280; margin-top: 2px; }
        .open-btn { background: linear-gradient(135deg, #1a7a3c, #2ecc71); color: #fff; border: none; padding: 8px 18px; border-radius: 6px; font-size: 13px; font-weight: 700; cursor: pointer; text-decoration: none; display: inline-block; }
        .open-btn:hover { opacity: 0.9; }
        .preview-frame-wrap { flex: 1; overflow: hidden; background: #e8f0e8; padding: 20px; }
        .preview-frame-wrap iframe { width: 100%; height: 100%; border: none; border-radius: 8px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); background: #fff; }

        /* Welcome screen */
        .welcome { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; text-align: center; padding: 40px; }
        .welcome-icon { font-size: 64px; margin-bottom: 20px; }
        .welcome h2 { font-size: 22px; font-weight: 700; color: #1a7a3c; margin-bottom: 10px; }
        .welcome p { font-size: 15px; color: #6b7280; max-width: 360px; line-height: 1.6; }
    </style>
</head>
<body>

<div class="topbar">
    <div class="brand">ELocate <span>Email Templates Preview</span></div>
</div>

<div class="layout">
    <div class="sidebar">
        <div class="sidebar-title">All Templates</div>

        <button class="template-btn" onclick="loadTemplate('request-created.html', 'Request Created', this)">
            <span class="btn-icon">📝</span>
            <span class="btn-text">
                <span class="btn-name">Request Created</span>
                <span class="btn-desc">Sent when citizen submits request</span>
            </span>
        </button>

        <button class="template-btn" onclick="loadTemplate('request-approved.html', 'Request Approved', this)">
            <span class="btn-icon">✅</span>
            <span class="btn-text">
                <span class="btn-name">Request Approved</span>
                <span class="btn-desc">Sent when facility approves request</span>
            </span>
        </button>

        <button class="template-btn" onclick="loadTemplate('pickup-scheduled.html', 'Pickup Scheduled', this)">
            <span class="btn-icon">📅</span>
            <span class="btn-text">
                <span class="btn-name">Pickup Scheduled</span>
                <span class="btn-desc">Sent when pickup date is set</span>
            </span>
        </button>

        <button class="template-btn" onclick="loadTemplate('pickup-completed.html', 'Pickup Completed', this)">
            <span class="btn-icon">📦</span>
            <span class="btn-text">
                <span class="btn-name">Pickup Completed</span>
                <span class="btn-desc">Sent after driver collects device</span>
            </span>
        </button>

        <button class="template-btn" onclick="loadTemplate('pickup-failed.html', 'Pickup Failed', this)">
            <span class="btn-icon">⚠️</span>
            <span class="btn-text">
                <span class="btn-name">Pickup Failed</span>
                <span class="btn-desc">Sent when pickup attempt fails</span>
            </span>
        </button>

        <button class="template-btn" onclick="loadTemplate('device-received.html', 'Device Received', this)">
            <span class="btn-icon">🏭</span>
            <span class="btn-text">
                <span class="btn-name">Device Received</span>
                <span class="btn-desc">Sent when facility receives device</span>
            </span>
        </button>

        <button class="template-btn" onclick="loadTemplate('recycling-completed.html', 'Recycling Completed', this)">
            <span class="btn-icon">🎉</span>
            <span class="btn-text">
                <span class="btn-name">Recycling Completed</span>
                <span class="btn-desc">Sent after recycling &amp; payment</span>
            </span>
        </button>

        <button class="template-btn" onclick="loadTemplate('driver-assignment.html', 'Driver Assignment', this)">
            <span class="btn-icon">🚚</span>
            <span class="btn-text">
                <span class="btn-name">Driver Assignment</span>
                <span class="btn-desc">Sent to driver for new pickup</span>
            </span>
        </button>

        <button class="template-btn" onclick="loadTemplate('facility-assignment.html', 'Facility Assignment', this)">
            <span class="btn-icon">📋</span>
            <span class="btn-text">
                <span class="btn-name">Facility Assignment</span>
                <span class="btn-desc">Sent to facility for new request</span>
            </span>
        </button>

        <button class="template-btn" onclick="loadTemplate('partner-approved.html', 'Partner Approved', this)">
            <span class="btn-icon">🤝</span>
            <span class="btn-text">
                <span class="btn-name">Partner Approved</span>
                <span class="btn-desc">Sent when partner is approved</span>
            </span>
        </button>

        <button class="template-btn" onclick="loadTemplate('partner-rejected.html', 'Partner Rejected', this)">
            <span class="btn-icon">❌</span>
            <span class="btn-text">
                <span class="btn-name">Partner Rejected</span>
                <span class="btn-desc">Sent when partner is rejected</span>
            </span>
        </button>

        <button class="template-btn" onclick="loadTemplate('citizen-reminder.html', 'Citizen Reminder', this)">
            <span class="btn-icon">🔔</span>
            <span class="btn-text">
                <span class="btn-name">Citizen Reminder</span>
                <span class="btn-desc">Sent to facility as reminder</span>
            </span>
        </button>
    </div>

    <div class="preview-area">
        <div class="preview-toolbar" id="toolbar" style="display:none;">
            <div>
                <div class="current-name" id="currentName"></div>
                <div class="current-file" id="currentFile"></div>
            </div>
            <a class="open-btn" id="openBtn" target="_blank">Open in New Tab ↗</a>
        </div>

        <div class="preview-frame-wrap" id="frameWrap">
            <div class="welcome" id="welcomeScreen">
                <div class="welcome-icon">✉️</div>
                <h2>Email Template Preview</h2>
                <p>Select a template from the sidebar to preview it here.</p>
            </div>
            <iframe id="previewFrame" style="display:none;"></iframe>
        </div>
    </div>
</div>

<script>
    function loadTemplate(file, name, btn) {
        // Update active state
        document.querySelectorAll('.template-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');

        // Update toolbar
        document.getElementById('toolbar').style.display = 'flex';
        document.getElementById('currentName').textContent = name;
        document.getElementById('currentFile').textContent = file;
        document.getElementById('openBtn').href = file;

        // Show iframe, hide welcome
        document.getElementById('welcomeScreen').style.display = 'none';
        const frame = document.getElementById('previewFrame');
        frame.style.display = 'block';
        frame.src = file;
    }
</script>

</body>
</html>
