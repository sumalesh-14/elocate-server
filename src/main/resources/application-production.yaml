spring:
  application:
    name: elocate
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 3
      minimum-idle: 1
      idle-timeout: 30000
      max-lifetime: 1800000
      connection-timeout: 30000
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
  mail:
    host: ${EMAIL_HOST}
    port: ${EMAIL_PORT:587}
    username: ${EMAIL_USERNAME}
    password: ${EMAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          ssl:
            enable: false
          connectiontimeout: 30000
          timeout: 30000
          writetimeout: 30000

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: ${CONTEXT_PATH:/elocate}

management:
  endpoints:
    web:
      exposure:
        include: health,info
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  health:
    mail:
      enabled: false  # Disable mail health check (causes timeout)
    db:
      enabled: false  # Disable DB health check for faster response

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  otp:
    expiry-minutes: ${OTP_EXPIRY_MINUTES:10}
    max-attempts: ${OTP_MAX_ATTEMPTS:3}
  frontend:
    url: ${FRONTEND_URL:https://elocate-frontend.vercel.app}
  driver:
    sla-hours: ${DRIVER_SLA_HOURS:24}
    sla-monitoring-enabled: ${DRIVER_SLA_MONITORING_ENABLED:true}
  base:
    url: ${APP_BASE_URL:https://elocate-frontend.vercel.app}
  email:
    # Email provider: smtp or sendgrid
    provider: ${EMAIL_PROVIDER:sendgrid}
    from: ${EMAIL_FROM:noreply@elocate.com}
    from-name: ${EMAIL_FROM_NAME:ELocate}
    # Enable/disable email notifications for recycling workflow
    notifications:
      enabled: ${EMAIL_NOTIFICATIONS_ENABLED:true}
      # Individual email type controls
      request-created: ${EMAIL_REQUEST_CREATED:true}
      request-approved: ${EMAIL_REQUEST_APPROVED:true}
      driver-assignment: ${EMAIL_DRIVER_ASSIGNMENT:true}
      pickup-scheduled: ${EMAIL_PICKUP_SCHEDULED:true}
      pickup-completed: ${EMAIL_PICKUP_COMPLETED:true}
      pickup-failed: ${EMAIL_PICKUP_FAILED:true}
      device-received: ${EMAIL_DEVICE_RECEIVED:true}
      recycling-completed: ${EMAIL_RECYCLING_COMPLETED:true}
      facility-assignment: ${EMAIL_FACILITY_ASSIGNMENT:true}
      reminder: ${EMAIL_REMINDER:true}
    # Use HTML templates (true) or plain text (false)
    use-html-templates: ${EMAIL_USE_HTML_TEMPLATES:true}

sendgrid:
  api:
    key: ${SENDGRID_API_KEY:}

# AWS S3 Configuration
aws:
  access-key-id: ${AWS_ACCESS_KEY_ID}
  secret-access-key: ${AWS_SECRET_ACCESS_KEY}
  s3:
    bucket-name: ${AWS_S3_BUCKET_NAME:elocate-pickup-photos}
    region: ${AWS_S3_REGION:eu-north-1}

auth0:
  domain: ${AUTH0_DOMAIN}
  clientId: ${AUTH0_CLIENT_ID}
  clientSecret: ${AUTH0_CLIENT_SECRET}
  connection: ${AUTH0_CONNECTION:Username-Password-Authentication}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operations-sorter: method
    tags-sorter: alpha
